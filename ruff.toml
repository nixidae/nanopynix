target-version = "py313"
line-length = 120

# `uv` wrote the `pyproject.toml` and the `uv.lock` of each project under
# `ddrn/examples/venv-graph/projects`, and `projects/README.md` gives the
# command and each hand edit. They are input data of an example, and not source
# of this repository, so a finding here would only ask a reader to edit what a
# tool generates. pyright still reads this tree, so the Python of a project
# meets the type rules.
exclude = ["ddrn/examples/venv-graph/projects"]

[lint]
select = [
  "E",
  "W", # pycodestyle
  "F", # pyflakes (real bugs)
  "I", # isort
]

ignore = [
  "E501", # line length handled by line-length setting
]

[lint.flake8-builtins]
ignorelist = ["eval"]

[lint.per-file-ignores]
"tests/**" = [
  "SLF001",
] # tests intentionally inspect private implementation state

[lint.isort]
combine-as-imports = true
known-first-party = [
  "nanopynix",
  "nanopynix_expr",
  "nanopynix_fetchers",
  "nanopynix_flake",
  "nanopynix_store",
  "nanopynix_util",
]
