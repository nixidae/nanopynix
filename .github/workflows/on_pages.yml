# GENERATED FILE -- do not edit by hand.
# Edit ci/workflows/on_pages.nix; a pytest run renders this file again.

name: Pages
'on':
  push:
    branches:
    - main
  workflow_dispatch: null
jobs:
  docs-build:
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 135
    steps:
    - name: Make room on the runner
      run: df -h /; sudo rm -rf /usr/lib/jvm /usr/share/dotnet /usr/share/swift /usr/local/.ghcup
        /usr/local/julia* /usr/local/lib/android /opt/az /usr/local/share/powershell
        /usr/local/share/chromium /opt/microsoft /opt/google /usr/lib/firefox; docker
        system prune --all --force; docker builder prune --all --force; df -h /
      if: runner.os == 'Linux'
      timeout-minutes: 10
      working-directory: /
    - uses: actions/checkout@main
      timeout-minutes: 10
    - uses: cachix/install-nix-action@master
      with:
        extra_nix_config: |
          access-tokens = github.com=${{ github.token }}
          experimental-features = nix-command flakes
      timeout-minutes: 15
    - uses: cachix/cachix-action@master
      with:
        name: lillecarl
        authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
        useDaemon: false
      timeout-minutes: 15
    - name: Build documentation
      run: nix build --file . nanopynix-docs --out-link result --print-build-logs
        --print-out-paths
      timeout-minutes: 30
    - name: Verify docs closure
      run: nix store verify --recursive --no-trust "$(readlink -f result)"
      timeout-minutes: 15
    - name: Prepare Pages artifact
      run: nix run --file . ciSteps.prepare-pages
      timeout-minutes: 10
    - uses: actions/upload-pages-artifact@main
      with:
        path: public
      timeout-minutes: 15
  docs-deploy:
    runs-on: ubuntu-24.04
    needs: docs-build
    if: github.ref == 'refs/heads/main'
    permissions:
      id-token: write
      pages: write
    concurrency:
      cancel-in-progress: false
      group: pages
    timeout-minutes: 37
    steps:
    - name: Report what the gating jobs did
      run: 'echo "the jobs this deploy waits for finished as: $GATE_RESULTS"'
      if: ${{ always() }}
      env:
        GATE_RESULTS: ${{ join(needs.*.result, ' ') }}
      timeout-minutes: 2
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@main
      if: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
        && !contains(needs.*.result, 'skipped') }}
      with:
        timeout: 900000
      timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
