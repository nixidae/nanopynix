[tool.coverage.run]
source_pkgs = ["libpynix", "pynix", "pynix_lsp"]
branch = true
# A huggorm worker may run in a `multiprocessing` child. `concurrency =
# multiprocessing` plus `parallel = true` gives each process its own data file
# (merged later via `coverage combine`); `sigterm` flushes data on a graceful
# stop. A freshly exec'd interpreter picks up COVERAGE_PROCESS_START only via
# the `sitecustomize.py` of `nanopynix_testing`, whose directory that
# project's `beartype_hook` puts on PYTHONPATH.
concurrency = ["multiprocessing", "thread"]
parallel = true
sigterm = true

[tool.coverage.paths]
libpynix = ["libpynix/src/libpynix", "*/site-packages/libpynix"]
pynix = ["pynix/src/pynix", "*/site-packages/pynix"]
pynix_lsp = ["pynix-lsp/src/pynix_lsp", "*/site-packages/pynix_lsp"]

[tool.coverage.report]
show_missing = true
skip_empty = true
