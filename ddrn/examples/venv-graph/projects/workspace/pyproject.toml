readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[tool.uv.workspace]
members = [
    "packages/ws-core",
    "packages/ws-cli",
]

[dependency-groups]
ddrn = [
    "editables>=0.6",
    "hatchling>=1.31.0",
    "installer>=1.0.1",
]
