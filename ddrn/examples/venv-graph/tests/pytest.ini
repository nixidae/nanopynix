; The tests of `ddrn/examples/venv-graph`, which are a separate run.
;
; **These tests are not part of the suite of the repository.** The `testpaths`
; of `../../../../pytest.ini` names `tests` only, so a plain `pytest` never
; collects this directory. This file gives the directory its own rootdir, so
; the run needs none of the nanopynix markers and none of the beartype
; instrumentation that the repository installs over its own packages.
;
; Two commands:
;
;   pytest ddrn/examples/venv-graph/tests -m "not nix"
;       the packaging decisions only. It runs in a second, and it builds
;       nothing.
;
;   pytest ddrn/examples/venv-graph/tests
;       the same, and the sealed graph. This one builds the patched Nix, which
;       takes about 20 minutes the first time and nothing after that.
[pytest]
anyio_mode = auto
testpaths = .
; `ddrn_venv` is not installed. A planner reaches it through `PYTHONPATH`
; inside a build sandbox, and a test reaches it through this line.
;
; `demoback` is the fixture build backend. A node of the sealed graph reaches
; it as an installed wheel, and `test_local_sdist.py` calls its hooks directly,
; so that the shape of the archive is a one second test and not a build.
pythonpath = ../planner fixtures/demo-backend
markers =
    nix: builds with the patched Nix, in a private store; slow, and not a unit test
