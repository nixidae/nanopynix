[pytest]
anyio_mode = auto
# `pynix/tests` is what makes `support` and `_shared_sessions` importable by
# the bare names that suite uses.
pythonpath = libpynix/src pynix/src pynix-lsp/src pynix/tests pynix-lsp/tests
# Every suite of the repository, and issue #130 is why there is more than
# one. The packaged test runner (`nix/tests.nix`) passes no path and
# relies on this line, so a suite that moves into its own project and is
# not named here leaves every job of the CI matrix without a word.
# Each project also has its own `pytest.ini` for a run of that project
# alone; this file wins when the run starts at the repository root,
# because pytest reads one rootdir and one ini.
testpaths = tests libpynix/tests pynix/tests pynix-lsp/tests
# beartype instrumentation (libpynix, pynix and pynix_lsp) comes first, because the hook must run before any of those
# packages is imported. pytest-beartype's `beartype_packages` ini option
# cannot do it at all; the hook's module docstring gives the reason.
#
# **Every plugin is registered here, and none in a conftest.**
# `pytest_plugins` is legal only in a top-level conftest, and a run that
# starts at the repository root makes each project's conftest a
# non-top-level one. pytest then fails collection outright. Every job of
# CI run 31706977896 died that way, while each project's own gate stayed
# green, because a gate run makes that same file top-level again.
#
# `-p` has neither restriction: it is processed during command-line
# parsing, before the first conftest. Each name is an installed package,
# which is what makes it importable that early. A module reached through
# `pythonpath` or through the rootdir is not, and cannot go here --
# `pynix-lsp/tests/conftest.py` imports its own server fixtures for that
# reason.
addopts = -p nanopynix_testing.beartype_hook
  -p test_support.plugin
  -p huggorm.testing.environment
  -p huggorm.testing.settings
markers =
    static_gate: runs a CI static-checks tool; ordered first, and never fails the run
