[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nanopynix-testing"
version = "0.1.0"
description = "The beartype instrumentation of the pynix suites"
authors = [{ name = "nanopynix contributors" }]
requires-python = ">=3.13"
# `beartype` and `coverage` for `beartype_hook` and the `sitecustomize.py`
# beside it. A suite that silently loses the hook still passes, which is why
# the dependency is declared and not left to whatever the runner installs.
dependencies = ["pytest", "beartype", "coverage"]

# The same PEP 639 fields as `nanopynix/pyproject.toml`, and the same reason.
license = "Apache-2.0"
license-files = [ "LICENSE" ]
classifiers = [
  "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://github.com/nixidae/nanopynix"

[tool.hatch.build.targets.wheel]
packages = ["src/nanopynix_testing"]
